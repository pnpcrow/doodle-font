[package]
name = "doodle-font"
version = "0.1.0"
description = "Doodle Font native authoring studio"
edition = "2021"
default-run = "doodle-font"

[lib]
name = "doodle_core"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
tiny-skia = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15"
unicode-segmentation = "1.12"
ttf-parser = "0.25"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rustybuzz = "0.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

