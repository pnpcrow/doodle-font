[package]
name = "doodle-font"
version = "0.1.0"
description = "두들 폰트 - Rust native font authoring studio"
edition = "2021"
default-run = "doodle-font"

[lib]
name = "doodle_core"

[features]
ui-qa = ["eframe/__screenshot"]

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
tiny-skia = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
rfd = "0.15"
unicode-segmentation = "1.12"
ttf-parser = "0.25"
rustybuzz = "0.20"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
