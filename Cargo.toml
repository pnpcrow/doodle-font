[package]
name = "doodle-font"
version = "0.1.0"
description = "두들 폰트 - Rust native font authoring studio"
edition = "2021"
default-run = "doodle-font"

[lib]
name = "doodle_core"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
tiny-skia = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
rfd = "0.15"
unicode-segmentation = "1.12"
ttf-parser = "0.25"
rustybuzz = "0.20"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
